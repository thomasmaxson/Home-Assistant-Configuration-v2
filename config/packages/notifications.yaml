#
# @author      : Thomas Maxson
# @package     : Notifications
# @description :
#
################################################################################

template:
  - sensor:
      - unique_id: notifications
        state: template
        attributes:
          dishwasher_complete: |
            {%- if is_state( 'input_boolean.reminder_dishwasher_complete', 'on' ) %}
              Your dishes are clean and are ready to be put away.
            {% endif %}

          laundry_complete_washer: |
            {%- if is_state( 'input_boolean.reminder_laundry_complete_washer', 'on' ) -%}
              {{ [
                'Your washed clothes are ready to be dried.',
                'Unless you’re trying to grow a mold colony, it’s time to move your clothes to the dryer.', 
                'Your clothes are officially clean and currently marinating in their own dampness.', 
                'Congratulations, the washer did its job. Now it’s your turn.'
              ] | random }}
            {%- endif -%}

          laundry_complete_dryer: |
            {%- if is_state( 'input_boolean.reminder_laundry_complete_dryer', 'on' ) -%}
              {{ [
                'Your dried clothes are ready to be folded.', 
                'Your clothes are bone dry and awaiting your minimal effort.', 
                'Congratulations, the dryer did all the hard work, now it’s your turn.', 
                'The dryer is complete. Your warm pile of procrastination is ready.', 
                'Please remove your clothes from the dryer and place them on the designated laundry chair.'
              ] | random }}
            {%- endif -%}

          waste_bring_in: |
            {%- if is_state( 'input_boolean.reminder_waste_bring_in_solid', 'on' ) %}
              {%- set bins = [
                ( 'trash', 'schedule.waste_bring_in_solid' ),
                ( 'recycling', 'schedule.waste_bring_in_recycling' )
              ] | selectattr( 1, 'eq', 'on' ) | map( attribute = 0 ) | list %}

              {%- if bins %}
                {%- set labels = bins[:-1] | join( ', ' ) ~ ' and ' ~ bins[-1] if bins | length > 1 else bins[0] %}
                {{ [
                  'Do not forget to bring the ' ~ labels ~ ' bins in.',
                  'The bins will feel lonely if you leave them outside.',
                  'The HOA will get mad if you leave the bins out on the street.'
                ] | random }}
              {%- endif %}
            {% endif %}

          waste_take_out: |
            {%- if is_state( 'input_boolean.reminder_waste_take_out_solid', 'on' ) %}
              {%- set bins = [
                ( 'trash', 'schedule.waste_take_out_solid' ),
                ( 'recycling', 'schedule.waste_take_out_recycling' ),
                ( 'bulk trash', 'schedule.waste_take_out_bulk' )
              ] | selectattr( 1, 'eq', 'on' ) | map( attribute = 0 ) | list %}

              {%- if bins %}
                {%- set labels = bins[:-1] | join( ', ' ) ~ ' and ' ~ bins[-1] if bins | length > 1 else bins[0] %}
                {{ [
                  'Tomorrow is the big day: ' ~ labels ~ ' day!',
                  labels | capitalize ~ ' should go out before tomorrow morning.',
                  'Do not forget to take the ' ~ labels ~ ' out.'
                ] | random }}
              {%- endif %}
            {% endif %}
